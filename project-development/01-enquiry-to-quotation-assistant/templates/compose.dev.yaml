# Development example only; copy into application/infra.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: eq_dev
      POSTGRES_USER: eq_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local development password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - eq_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eq_dev -d eq_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7.4
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - eq_redis:/data
volumes:
  eq_postgres:
  eq_redis:

